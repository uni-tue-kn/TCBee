name: Python database API

on:
  push:
    branches: [main, dev]
    paths: ['tcbee-python/**', 'examples/db/**', '.github/workflows/python-api.yml']
  pull_request:
    paths: ['tcbee-python/**', 'examples/db/**', '.github/workflows/python-api.yml']

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install './tcbee-python[test]' matplotlib build
      - run: python -m unittest discover -s tcbee-python/tests -v
      - run: ruff check tcbee-python examples/db
      - run: ruff format --check tcbee-python examples/db
      - run: python -m build tcbee-python
