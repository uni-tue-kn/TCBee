name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            llvm clang \
            libelf-dev libclang-dev zlib1g-dev \
            pkg-config make \
            autoconf automake autopoint gettext libtool flex bison gawk \
            fontconfig libfontconfig1-dev \
            libgl-dev libegl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build tcbee-record
        # Builds libbpf, libelf and zlib from source and links them statically
        run: |
          cd tcbee-record
          cargo build --release --features static

      - name: Cache cargo (workspace)
        uses: Swatinem/rust-cache@v2
        with:
          key: release-bundled

      # One cargo call for both tools: DuckDB and SQLite are compiled once (bundled, both engines)
      - name: Build tcbee-process and tcbee-viz (bundled)
        run: cargo build --release -p tcbee-process -p tcbee-viz --features bundled

      - name: Build tcbee-live
        # Like tcbee-record: libbpf, libelf and zlib built from source and linked statically
        run: |
          cd tcbee-live
          cargo build --release --features static

      - name: Package release archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          NAME="tcbee-$TAG-linux-x86_64"
          mkdir -p "$NAME"
          cp tcbee-record/target/release/tcbee-record "$NAME/"
          cp target/release/tcbee-process "$NAME/"
          cp target/release/tcbee-viz "$NAME/"
          cp tcbee-live/target/release/tcbee-live "$NAME/"
          sed "s|@VERSION@|$TAG|" tcbee > "$NAME/tcbee"
          cp packaging/install.sh "$NAME/"
          cp LICENSE NOTICES "$NAME/"
          chmod 755 "$NAME"/tcbee* "$NAME/install.sh"
          tar czf "$NAME.tar.gz" "$NAME"

      - name: Install nfpm
        run: |
          curl -sSLO https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz
          echo "0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783  nfpm_2.47.0_Linux_x86_64.tar.gz" | sha256sum -c
          tar xzf nfpm_2.47.0_Linux_x86_64.tar.gz nfpm

      - name: Build .deb and .rpm
        env:
          TAG: ${{ github.ref_name }}
        run: |
          export VERSION="${TAG#v}"
          export PKG_DIR="$PWD/tcbee-$TAG-linux-x86_64"
          GLIBC_MIN=$(objdump -T "$PKG_DIR"/tcbee-{record,process,viz,live} | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1 | cut -d_ -f2)
          test -n "$GLIBC_MIN"
          export GLIBC_MIN
          envsubst '$VERSION $PKG_DIR $GLIBC_MIN' < packaging/nfpm.yaml > nfpm.yaml
          mkdir -p dist
          ./nfpm package -f nfpm.yaml -p deb -t dist/
          ./nfpm package -f nfpm.yaml -p rpm -t dist/
          mv dist/* .
          sha256sum "tcbee-$TAG-linux-x86_64.tar.gz" tcbee_*.deb tcbee-*.rpm > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "TCBee ${{ github.ref_name }}" \
            --generate-notes \
            "tcbee-${{ github.ref_name }}-linux-x86_64.tar.gz" tcbee_*.deb tcbee-*.rpm SHA256SUMS
