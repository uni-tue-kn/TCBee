[package]
name = "tcbee-live"
version = "0.1.0"
edition.workspace = true

license.workspace = true

[dependencies]
anyhow = { workspace = true, default-features = true }
env_logger = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
egui_plot = { workspace = true }
indexmap = { workspace = true, features = ["std"] }
libbpf-rs = "0.27"

[build-dependencies]
anyhow = { workspace = true, default-features = true }
libbpf-cargo = "0.27"

[features]
# Link libbpf, libelf and zlib statically (built from source), so the binary does not
# depend on the host's libelf. Used for release builds.
static = ["libbpf-rs/vendored"]

[[bin]]
name = "tcbee-live"
path = "src/main.rs"
