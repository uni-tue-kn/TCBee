[package]
name = "tcbee-process"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
ts_storage.workspace = true
tcbee-trace.workspace = true
#tcbee-common = { path = "../tcbee/tcbee-common" }
log.workspace = true
#sqlx = {version = "0.8.3", features = ["sqlite", "runtime-tokio"] }
serde = { version = "1.0.217", features = ["serde_derive"] }
indicatif = "0.17.11"
env_logger.workspace = true
bincode = "1.3.3"
argparse = "0.2.2"
anyhow.workspace = true
workspace-hack.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
# Storage engines, forwarded to ts_storage. A build without `duckdb` never compiles libduckdb-sys
# (cargo build --no-default-features --features sqlite). An engine that is not built in is
# rejected at argument parsing.
default = ["sqlite", "duckdb"]
sqlite = ["ts_storage/sqlite"]
duckdb = ["ts_storage/duckdb"]
# Bundled C libraries of the enabled engines.
bundled = ["ts_storage/bundled"]
# Dev only: derives Serialize on the bindings and enables the fixture generator test
# (cargo test --features fixture-gen regenerate_fixtures).
fixture-gen = []
