[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tcbee"
version = "0.1.0"
description = "Read, explore and plot TCBee flow databases from Python"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"

[project.optional-dependencies]
duckdb = ["duckdb>=1.0"]
pandas = ["pandas>=1.5"]
numpy = ["numpy>=1.23"]
test = ["duckdb>=1.0", "pandas>=1.5", "numpy>=1.23", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
