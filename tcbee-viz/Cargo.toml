[package]
name = "tcbee-viz"
version = "0.1.0"
authors = ["ScatteredDrifter","MoritzFlu"]
edition.workspace = true
license.workspace = true

[dependencies]
eframe = "0.31"
egui = "0.31"
egui_plot = "0.31"
rand = "0.9.0"
ts_storage.workspace = true
rfd = "0.15.0"
duckdb-cache.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
# Storage engines, forwarded to ts_storage. Without `duckdb`, libduckdb-sys is never compiled
# (`cargo build --no-default-features --features sqlite`). Opening a file of a disabled engine
# shows an error in the UI.
default = ["sqlite", "duckdb"]
sqlite = ["ts_storage/sqlite"]
duckdb = ["ts_storage/duckdb"]
# Bundled C libraries of the enabled engines.
bundled = ["ts_storage/bundled"]
