[package]
name = "ts_storage"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = ["sqlite", "duckdb", "legacy"]
# Engines of the schema v2 API. Build with --no-default-features --features sqlite to skip DuckDB
# (which takes very long to build).
sqlite = ["dep:rusqlite"]
duckdb = ["dep:duckdb"]
# The old TSDBInterface API (DuckDB only; its SQLite backend was removed). Temporary.
legacy = ["dep:duckdb", "dep:ouroboros"]
# Bundled C libraries, for whichever engines are enabled.
bundled = ["duckdb?/bundled", "rusqlite?/bundled"]

[dependencies]
duckdb = { version = "1.3.2", features = ["appender-arrow"], optional = true }
ouroboros = { version = "0.18.5", optional = true }
rusqlite = { version = "0.37", optional = true }
thiserror = "1.0.60"

[[test]]
name = "duckdb"
required-features = ["legacy"]
